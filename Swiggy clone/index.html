<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swiggy Clone</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header>
  

  <div class="logo">
    <img src="https://cdn.worldvectorlogo.com/logos/swiggy-1.svg" alt="Swiggy Logo">
     <h2>Swiggy</h2>
  </div>
   
  <div class="location">
     <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" alt="Location Icon">
    <span>Deliver to</span>
    <h3>KIIT, Bhubaneswar</h3>
  </div>
   
  <div class="account">
    <i class="fa-solid fa-user"></i>
    <span>Devangi Banerjee</span>
  </div>
  <input type="text" id="search" placeholder="Search food...">
  <div class="cart-icon"> 
    <i class="fa-solid fa-cart-shopping"></i>
    <span id="cart-count">0</span>
  </div>

</header>
<div class="main">

  <!-- LEFT: FOOD ITEMS -->
  <div class="food-section">
    <h3>Popular Near You</h3>
    <div id="food-container"></div>
  </div>

  <!-- RIGHT: CART -->
  <div class="cart-section">
    <h3>Your Cart</h3>
    <div id="cart-items"></div>

    <p>Total Items: <span id="total-items">0</span></p>
    <p>Total Price: ₹<span id="total-price">0</span></p>

    <button class="checkout">Checkout</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
